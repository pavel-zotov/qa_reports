name: firebird-push-monitor

on:
  schedule:
    - cron: '*/15 * * * *'   # проверка каждые 15 минут (время UTC)
  workflow_dispatch:          # чтобы можно было запустить вручную для теста

permissions:
  contents: write             # чтобы workflow мог коммитить файл last-sha

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Получить последний коммит FirebirdSQL/firebird
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(gh api 'repos/FirebirdSQL/firebird/commits?per_page=1' --jq '.[0].sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Сравнить с последним замеченным
        id: cmp
        run: |
          old=$(cat last-sha 2>/dev/null || echo '')
          new='${{ steps.latest.outputs.sha }}'
          if [ -z "$old" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'save=true'    >> "$GITHUB_OUTPUT"
          elif [ "$old" != "$new" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'save=true'    >> "$GITHUB_OUTPUT"
            echo "old=$old"     >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'save=false'    >> "$GITHUB_OUTPUT"
          fi

      - name: Сформировать текст письма
        if: steps.cmp.outputs.changed == 'true'
        id: mail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          old='${{ steps.cmp.outputs.old }}'
          new='${{ steps.latest.outputs.sha }}'
          gh api "repos/FirebirdSQL/firebird/compare/$old...$new" > compare.json
          count=$(jq '.commits | length' compare.json)
          {
            echo "В репозитории FirebirdSQL/firebird появились новые коммиты ($count):"
            echo ""
            i=0
            while IFS=$'\t' read -r sha cdate author msg; do
              i=$((i+1))
              when=$(TZ='Europe/Moscow' date -d "$cdate" '+%Y-%m-%d %H:%M:%S MSK' 2>/dev/null || echo "$cdate")
              printf '%s) %s — %s\n    %s\n    https://github.com/FirebirdSQL/firebird/commit/%s\n\n' \
                "$i" "$when" "$author" "$msg" "$sha"
            done < <(jq -r '.commits[] | [.sha, .commit.committer.date, (.commit.author.name // "?"), (.commit.message | split("\n")[0])] | @tsv' compare.json)
            if [ "$(jq '.truncated' compare.json)" = 'true' ]; then
              echo "(список усечён: коммитов больше 250, показаны не все)"
              echo ""
            fi
            if [ "$count" = '0' ]; then
              echo "(список коммитов пуст — возможно, была перезапись истории;"
              echo "см. полное сравнение по ссылке ниже)"
              echo ""
            fi
            echo "Полное сравнение:"
            echo "https://github.com/FirebirdSQL/firebird/compare/$old...$new"
          } > email-body.txt
          {
            echo "count=$count"
            echo 'body<<BODY_EOF'
            cat email-body.txt
            echo 'BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Отправить письмо
        if: steps.cmp.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.yandex.ru
          server_port: 465            # TLS включается автоматически на 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: 'Firebird push monitor <${{ secrets.SMTP_USERNAME }}>'
          to: p519446@yandex.ru
          subject: '[firebird] Новые коммиты в FirebirdSQL/firebird (${{ steps.mail.outputs.count }})'
          body: ${{ steps.mail.outputs.body }}

      - name: Запомнить новый SHA
        if: steps.cmp.outputs.save == 'true'
        run: |
          echo '${{ steps.latest.outputs.sha }}' > last-sha
          git config user.name  'monitor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add last-sha
          git diff --cached --quiet || git commit -m 'update last-sha'
          git push
