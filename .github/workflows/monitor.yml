name: firebird-push-monitor

on:
  schedule:
    - cron: '2-57/10 * * * *' # каждые 10 минут (:02,:12,:22…), слоты смещены с начала часа —
                              # в :00 планировщик GitHub перегружен и отбрасывает запуски
  workflow_dispatch:          # чтобы можно было запустить вручную для теста

# Ветки master, v5.0-release, v4.0-release, B3_0_Release отслеживаются
# по отдельности: каждой — своё письмо с именем ветки в теме.
# Пуши в любые другие ветки собираются в одно сводное письмо.
# Состояние вершин всех веток хранится в branch-state.json.

permissions:
  contents: write             # чтобы workflow мог коммитить файл branch-state.json

concurrency:
  group: firebird-push-monitor # сериализует запуски: параллельный запуск дождётся очереди,
  cancel-in-progress: false    # увидит уже обновлённое состояние и не пришлёт дубль

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch tips of all FirebirdSQL/firebird branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate 'repos/FirebirdSQL/firebird/branches?per_page=100' \
            --jq '.[] | [.name, .commit.sha] | @tsv' > branches.tsv
          wc -l branches.tsv

      - name: Detect branch changes and send emails
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          cat > notify.py <<'PYEOF'
          import json, os, smtplib, ssl, subprocess
          from datetime import datetime
          from email.message import EmailMessage
          from zoneinfo import ZoneInfo

          NAMED = ['master', 'v5.0-release', 'v4.0-release', 'B3_0_Release']
          TO = 'p519446@yandex.ru'
          MSK = ZoneInfo('Europe/Moscow')
          REPO = 'FirebirdSQL/firebird'

          def gh(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))

          state = {}
          if os.path.exists('branch-state.json'):
              state = json.load(open('branch-state.json', encoding='utf-8'))

          branches = {}
          for line in open('branches.tsv', encoding='utf-8'):
              name, sha = line.rstrip('\n').split('\t')
              branches[name] = sha

          changed_named = []
          changed_others = []
          for name, sha in branches.items():
              old = state.get(name)
              if old and old != sha:
                  item = (name, old, sha)
                  if name in NAMED:
                      changed_named.append(item)
                  else:
                      changed_others.append(item)

          def commit_entries(old, new):
              try:
                  d = gh('repos/' + REPO + '/compare/' + old + '...' + new)
              except Exception as exc:
                  print('compare failed:', exc)
                  return None
              entries = []
              for c in d.get('commits', []):
                  raw = c['commit']['committer']['date']
                  when = datetime.fromisoformat(raw.replace('Z', '+00:00')).astimezone(MSK)
                  entries.append((when.strftime('%Y-%m-%d %H:%M:%S %z'),
                                  c['commit']['author'].get('name', '?'),
                                  c['commit']['author'].get('email', ''),
                                  c['commit']['message'].splitlines()[0],
                                  c['sha']))
              total = d.get('total_commits')
              truncated = bool(d.get('truncated')) or (total is not None and total > len(entries))
              return entries, total, truncated

          def render_block(entries, total, truncated):
              lines = []
              numbered = len(entries) > 1
              for i, (when, author, email, msg, sha) in enumerate(entries, 1):
                  prefix = str(i) + ') ' if numbered else ''
                  lines.append(prefix + when + ' — ' + author)
                  lines.append('    ' + msg)
                  lines.append('    https://github.com/' + REPO + '/commit/' + sha)
                  lines.append('')
              if not entries:
                  lines.append('(no commits listed — history may have been rewritten or the list is unavailable)')
                  lines.append('')
              if truncated:
                  shown = str(len(entries))
                  total_s = str(total) if total else 'many'
                  lines.append('(list truncated: showing ' + shown + ' of ' + total_s + ' commits — see full comparison)')
                  lines.append('')
              return lines

          def send(subject, body):
              msg = EmailMessage()
              msg['From'] = 'Firebird push monitor <' + os.environ['SMTP_USERNAME'] + '>'
              msg['To'] = TO
              msg['Subject'] = subject
              msg.set_content(body)
              with smtplib.SMTP_SSL('smtp.yandex.ru', 465, context=ssl.create_default_context()) as smtp:
                  smtp.login(os.environ['SMTP_USERNAME'], os.environ['SMTP_PASSWORD'])
                  smtp.send_message(msg)

          BOT_NAMES = {'actions-user', 'github-actions', 'github-actions[bot]', 'github action'}
          BOT_EMAIL = 'action@github.com'

          def is_bot(author, email):
              return author.lower() in BOT_NAMES or email.lower() == BOT_EMAIL

          def subject_prefix(all_entries):
              if len(all_entries) == 1:
                  _, author, email, msg, _ = all_entries[0]
                  if is_bot(author, email) and 'increment build number' in msg.lower():
                      return '[' + author + '] [increment build number] '
                  return '[' + author + '] '
              humans = [a for (_, a, e, _, _) in all_entries if not is_bot(a, e)]
              pool = humans if humans else [a for (_, a, e, _, _) in all_entries]
              if pool and len(set(pool)) == 1:
                  return '[' + pool[0] + '] '
              return ''

          def time_stamp():
              return datetime.now(MSK).strftime('%H:%M') + '. '

          def sha_suffix(entries, subject):
              """First 7 chars of the earliest and the latest commit SHAs;
              each is appended only if not already present in the subject."""
              if not entries:
                  return ''
              ordered = sorted(entries, key=lambda e: e[0])
              picks = [ordered[0][4]]
              if ordered[-1][4] != ordered[0][4]:
                  picks.append(ordered[-1][4])
              tail = ''
              for s in picks:
                  short = s[:7]
                  if short not in (subject + tail):
                      tail += ' ' + short
              return tail

          sent = []
          for name, old, new in changed_named:
              res = commit_entries(old, new)
              entries, total_c, trunc = res if res else ([], 0, False)
              n = len(entries)
              lines = render_block(entries, total_c, trunc)
              lines += ['Full comparison:', 'https://github.com/' + REPO + '/compare/' + old + '...' + new]
              subject = (subject_prefix(entries) + time_stamp()
                         + 'New pushes in ' + REPO + ' branch: ' + name + ' (' + str(n) + ')')
              subject += sha_suffix(entries, subject)
              send(subject, '\n'.join(lines))
              sent.append(name + ': ' + str(n))

          if changed_others:
              lines = []
              links = []
              total = 0
              all_entries = []
              for name, old, new in changed_others:
                  res = commit_entries(old, new)
                  entries, total_c, trunc = res if res else ([], 0, False)
                  total += len(entries)
                  all_entries += entries
                  lines.append('Branch: ' + name + ' (' + str(len(entries)) + ')')
                  lines += render_block(entries, total_c, trunc)
                  links.append('- ' + name + ': https://github.com/' + REPO + '/compare/' + old + '...' + new)
              if lines:
                  branch_tag = ' [' + changed_others[0][0] + ']' if len(changed_others) == 1 else ''
                  lines = lines + ['Full comparison:'] + links
                  head = (subject_prefix(all_entries) + time_stamp()
                          + 'New pushes in ' + REPO + ' (' + str(total) + ')' + branch_tag)
                  head += sha_suffix(all_entries, head)
                  send(head, '\n'.join(lines))
                  sent.append('others: ' + str(total))

          json.dump(branches, open('branch-state.json', 'w', encoding='utf-8'), indent=1, sort_keys=True)

          summary = '; '.join(sent) if sent else 'no changes'
          print('emails sent:', summary)
          out = os.environ.get('GITHUB_OUTPUT')
          if out:
              with open(out, 'a', encoding='utf-8') as f:
                  f.write('sent<<EOF\n' + summary + '\nEOF\n')
          PYEOF
          python notify.py

      - name: Save new branch state
        run: |
          git config user.name  'monitor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add branch-state.json
          git diff --cached --quiet || git commit -m 'update branch-state'
          git push
